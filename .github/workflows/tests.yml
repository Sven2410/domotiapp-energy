name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Note the deliberate version gap: the supported minimum is Home Assistant
      # 2025.6.0 (see hacs.json and SPEC.md §0), but the suite runs against the
      # newest Home Assistant that pytest-homeassistant-custom-component pins.
      # Testing against the newest release is what surfaces deprecations early;
      # the 2025.6 floor is guarded by reviewing the API table in SPEC.md §0,
      # not by this workflow.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # The integration depends on panel_custom -> frontend, whose
          # hass_frontend package is a component requirement that the test
          # harness does not install by itself.
          python scripts/install_frontend_requirement.py

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest --cov=custom_components/domotiapp_energy --cov-report=term-missing
