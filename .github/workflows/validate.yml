name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so that upstream hassfest/HACS rule changes surface on their own.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The brands check always fails for a custom integration that has not
          # been added to the home-assistant/brands repository. Ignoring it is
          # the documented approach for custom repositories; remove this once
          # the domotiapp_energy brand is accepted upstream.
          ignore: brands
