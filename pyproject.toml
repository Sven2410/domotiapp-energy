[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domotiapp-energy"
version = "0.4.0"
description = "DomotiApp Energy - a manually configured energy coach for Home Assistant"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Sven2410" }]
keywords = ["home-assistant", "hacs", "energy", "custom-component"]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
# The integration itself has no runtime dependencies; see manifest.json -> "requirements": [].
dependencies = []

[project.urls]
Homepage = "https://github.com/Sven2410/domotiapp-energy"
Issues = "https://github.com/Sven2410/domotiapp-energy/issues"

[project.optional-dependencies]
# Development-only dependencies. These must never end up in manifest.json.
# pytest, pytest-asyncio and pytest-cov are deliberately not listed:
# pytest-homeassistant-custom-component pins those exactly to the versions used
# by the Home Assistant release it targets, and adding our own bounds only makes
# the resolver backtrack to an ancient release.
dev = [
  "ruff>=0.14.0",
  "mypy>=1.14",
  "pytest-homeassistant-custom-component>=0.13.316",
]

# The integration is loaded by Home Assistant from custom_components/, not from
# site-packages. `pip install -e ".[dev]"` therefore only needs to install the
# development dependencies; no Python package is distributed from this project.
[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]
# Recent Ruff versions also format Python code blocks inside Markdown. SPEC.md
# and the README contain illustrative snippets, not source; leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "D",     # pydocstyle
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "PL",    # pylint
  "PTH",   # flake8-use-pathlib
  "RET",   # flake8-return
  "RUF",   # ruff-specific
  "SIM",   # flake8-simplify
  "TID",   # flake8-tidy-imports
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  "D203",   # conflicts with D211 (no blank line before class docstring)
  "D213",   # conflicts with D212 (summary on first line)
  "PLR0913", # argument count is checked in review, not by the linter
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "PLR2004", # magic values are the point of a test assertion
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["custom_components/domotiapp_energy"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.13"
files = ["custom_components/domotiapp_energy"]
follow_imports = "silent"
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
# Home Assistant is not distributed with a py.typed marker for every helper module.
ignore_missing_imports = true
